<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Codemium v0.8 polyglot structural coverage</title>
  <desc id="desc">Comparison of v0.7 and v0.8 deep parser coverage across Python, JavaScript, JSX, TypeScript, and TSX.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="572" rx="22" fill="#0b0f14" stroke="#30363d"/>
  <text x="70" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f0f6fc">Polyglot Structural Coverage</text>
  <text x="70" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#8b949e">v0.7 → v0.8 · deep parsing across the five core source extensions used by the integration suite</text>
  <g transform="translate(70 158)"><rect width="250" height="130" rx="18" fill="#111820" stroke="#30363d"/><text x="22" y="37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e">DEEP-PARSED EXTENSIONS</text><text x="22" y="86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" fill="#a78bfa">1/5 → 5/5</text><text x="22" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c9d1d9">.py .js .jsx .ts .tsx</text></g>
  <g transform="translate(340 158)"><rect width="250" height="130" rx="18" fill="#111820" stroke="#30363d"/><text x="22" y="37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e">STRUCTURAL GRAPH</text><text x="22" y="86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" fill="#a78bfa">v2 → v3</text><text x="22" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c9d1d9">cross-language aware</text></g>
  <g transform="translate(610 158)"><rect width="250" height="130" rx="18" fill="#111820" stroke="#30363d"/><text x="22" y="37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e">JS / TS / TSX</text><text x="22" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" fill="#3fb950">TREE-SITTER</text><text x="22" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c9d1d9">deep parser runtime</text></g>
  <g transform="translate(880 158)"><rect width="250" height="130" rx="18" fill="#111820" stroke="#30363d"/><text x="22" y="37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e">CROSS-LANGUAGE</text><text x="22" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#3fb950">RESOLVED</text><text x="22" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#c9d1d9">module + imported symbol</text></g>
  <text x="70" y="335" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Deep parser coverage</text>
  <text x="785" y="335" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e">v0.7</text><text x="930" y="335" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e">v0.8</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    <text x="70" y="382" fill="#c9d1d9">Python (.py)</text><rect x="300" y="364" width="600" height="22" rx="11" fill="#21262d"/><rect x="300" y="364" width="600" height="22" rx="11" fill="url(#purple)"/><text x="790" y="381" fill="#f0f6fc">AST</text><text x="935" y="381" fill="#f0f6fc">AST</text>
    <text x="70" y="428" fill="#c9d1d9">JavaScript (.js)</text><rect x="300" y="410" width="600" height="22" rx="11" fill="#21262d"/><rect x="300" y="410" width="120" height="22" rx="11" fill="#484f58"/><rect x="420" y="410" width="480" height="22" rx="11" fill="url(#purple)"/><text x="770" y="427" fill="#8b949e">fallback</text><text x="930" y="427" fill="#f0f6fc">Tree-sitter</text>
    <text x="70" y="474" fill="#c9d1d9">JSX (.jsx)</text><rect x="300" y="456" width="600" height="22" rx="11" fill="#21262d"/><rect x="300" y="456" width="120" height="22" rx="11" fill="#484f58"/><rect x="420" y="456" width="480" height="22" rx="11" fill="url(#purple)"/><text x="770" y="473" fill="#8b949e">fallback</text><text x="930" y="473" fill="#f0f6fc">Tree-sitter</text>
    <text x="70" y="520" fill="#c9d1d9">TypeScript (.ts)</text><rect x="300" y="502" width="600" height="22" rx="11" fill="#21262d"/><rect x="300" y="502" width="120" height="22" rx="11" fill="#484f58"/><rect x="420" y="502" width="480" height="22" rx="11" fill="url(#purple)"/><text x="770" y="519" fill="#8b949e">fallback</text><text x="930" y="519" fill="#f0f6fc">Tree-sitter</text>
