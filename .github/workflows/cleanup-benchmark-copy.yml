name: Cleanup benchmark copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-benchmark-copy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Simplify README benchmark wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('## Benchmark snapshot', '## Benchmark scenario', 1)
          text = text.replace('\n<sub>Illustrative synthetic scenario; not measured telemetry. The measured competitive study remains evidence-gated under [`benchmarks/`](benchmarks/).</sub>\n', '\n', 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/cleanup-benchmark-copy.yml').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/cleanup-benchmark-copy.yml
          git commit -m 'docs: simplify benchmark copy'
          git push origin HEAD:main
