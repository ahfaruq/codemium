name: Codemium Core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dependency-light Codemium core
        run: python scripts/verify_core.py
      - name: Install Polyglot Intelligence runtime
        run: python -m pip install -r requirements-polyglot.txt
      - name: Verify Tree-sitter Polyglot Intelligence
        run: python scripts/verify_polyglot.py
