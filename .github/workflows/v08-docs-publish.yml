name: Publish v0.8 release docs

on:
  push:
    branches:
      - release/v0.8.0-polyglot-intelligence

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[v08-docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.8.0-polyglot-intelligence
          fetch-depth: 0
      - name: Migrate release documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing docs migration marker: {label}')
              return text.replace(old, new, 1)

          # README
          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          text=text.replace('version-v0.7.0-2F81F7', 'version-v0.8.0-2F81F7').replace('Version v0.7.0', 'Version v0.8.0')
          text=text.replace('See [`INSTALL.md`](INSTALL.md) for installation and hook trust, [`HOSTS.md`](HOSTS.md) for the adapter contract, [`PRD.md`](PRD.md) and [`PRD-v0.7.md`](PRD-v0.7.md) for requirements, and [`CHANGELOG.md`](CHANGELOG.md) for release history.', 'See [`INSTALL.md`](INSTALL.md) for installation and hook trust, [`HOSTS.md`](HOSTS.md) for the adapter contract, [`PRD.md`](PRD.md), [`PRD-v0.8.md`](PRD-v0.8.md), and [`PRD-v0.7.md`](PRD-v0.7.md) for requirements/history, and [`CHANGELOG.md`](CHANGELOG.md) for release history.')
          text=text.replace('- **Structural Intelligence** — relational repository graph with source provenance and parser capability reporting;', '- **Polyglot Intelligence** — parser-aware Structural Graph v3 with Tree-sitter JS/TS/TSX support, cross-language relationships, source provenance, and safe deterministic fallback;')
          old='''# Structural Intelligence — v0.7\n\nv0.7 upgrades the old lightweight repository inventory into **Structural Graph v2**.'''
          new='''# Polyglot Intelligence — v0.8\n\nv0.8 upgrades Structural Intelligence into **Structural Graph v3**: a parser-abstracted, cross-language repository index with deep JavaScript, TypeScript, and TSX support through Tree-sitter while preserving Python AST extraction and deterministic fallback behavior.'''
          text=replace(text,old,new,'README v0.8 heading')
          text=text.replace('''DEFINES\nCONTAINS\nIMPORTS\nCALLS''','''DEFINES\nCONTAINS\nIMPORTS\nIMPORTS_SYMBOL\nCALLS''',1)
          text=replace(text,'Parser coverage is explicit. Python uses standard-library AST extraction; other supported languages currently degrade to deterministic fallback parsing when deeper structural parsing is unavailable.','Parser coverage is explicit. Python uses standard-library AST extraction. JavaScript/JSX, TypeScript, and TSX use Tree-sitter deep parsing when the optional Polyglot runtime is installed. Other supported languages—and JS/TS/TSX when that runtime is unavailable—degrade safely to deterministic fallback parsing.','README parser coverage')
          marker='No LLM is required to construct the structural graph.\n'
          poly='''No LLM is required to construct the structural graph.\n\n## Tree-sitter deep parsing\n\nInstall the optional v0.8 Polyglot runtime when you want deep JavaScript/TypeScript/TSX extraction:\n\n```sh\npython -m pip install -r requirements-polyglot.txt\n```\n\nThe parser abstraction selects Python AST, Tree-sitter JavaScript/TypeScript/TSX, or the deterministic fallback parser based on language and runtime availability. Tree-sitter extraction identifies functions, arrow functions, classes/methods, TypeScript interfaces/types/enums, imports/exports, CommonJS bindings, calls, and inheritance with source locations.\n\nRelative repository imports can resolve across compatible source extensions, so relationships such as `legacy.js → math.ts`, `view.tsx → service.ts`, and `service.test.ts → service.ts` become first-class cross-language graph evidence. Resolved imported symbols use `IMPORTS_SYMBOL`; cross-language edges are labeled explicitly.\n'''
          text=replace(text,marker,poly,'README tree-sitter section')
          text=text.replace('The v0.7 retrieval order is:', 'The v0.8 retrieval order is:',1)
          text=replace(text,'Change Impact traverses reverse structural dependencies when available and retains a deterministic fallback for degraded graph state. Test Intelligence prefers structural `TESTS` relationships and labels naming/import fallback matches as HEURISTIC.','Change Impact is now **symbol-aware**: Git diff line ranges are mapped to changed symbols when possible, then weighted reverse traversal follows calls, imported symbols, dependencies, references, inheritance, tests, and cross-language edges. Affected surfaces carry score, confidence, provenance, distance, and cross-language evidence.\n\nTest Intelligence v3 ranks structural `TESTS` evidence ahead of naming/import fallback, classifies unit/integration/e2e tests, and produces a prioritized P0/P1/P2 test plan. Heuristic matches remain available but are explicitly lower-confidence.','README impact/test')
          text=text.replace('When `.codemium/` exists, doctor also reports structural graph and Project Brain freshness health.','When `.codemium/` exists, doctor also reports Structural Graph v3 health, parser runtime/coverage, cross-language relationships, and Project Brain freshness.')
          text=replace(text,'### 2. Codex lifecycle CI — every push / pull request','### 2. Polyglot Intelligence CI — every push / pull request\n\nAfter the dependency-light core gate passes, CI installs the pinned Tree-sitter runtime and executes the real JS/TS/TSX cross-language fixture:\n\n```sh\npython -m pip install -r requirements-polyglot.txt\npython scripts/verify_polyglot.py\n```\n\nThis gate proves JavaScript → TypeScript imported-symbol/call resolution, TSX → TypeScript dependencies, symbol-aware TypeScript impact, and prioritized mapped tests.\n\n### 3. Codex lifecycle CI — every push / pull request','README verification polyglot')
          text=text.replace('### 3. Full host validation — manual / release tags','### 4. Full host validation — manual / release tags',1).replace('### 4. AI benchmark — separate competitive evidence','### 5. AI benchmark — separate competitive evidence',1)
          text=replace(text,'## v0.7 scope boundaries\n\nCodemium v0.7 is **not** a generic graph product. It intentionally does not add:','## v0.8 scope boundaries\n\nCodemium v0.8 is **not** a generic graph product or language server. It intentionally does not add:', 'README scope')
          text=text.replace('- hosted/shared graph services.','- hosted/shared graph services;\n- deep Go/Rust/Java parsing in v0.8.0;\n- replacement for TypeScript type-checkers or language servers.',1)
          old_status='''`v0.7.0` introduces **Structural Intelligence & Evidence Bridge**: a local deterministic relational repository graph, delta-first refresh, bounded graph queries, graph-assisted Working Sets, structural impact/test intelligence, structured Project Brain evidence, and source-change freshness/revalidation. The graph guides navigation but never replaces source authority. Codex remains the stable/reference adapter; Claude Code, Gemini CLI, Cursor, and OpenCode share the same vendor-neutral core through their native adapters.'''
          new_status='''`v0.8.0` introduces **Polyglot Intelligence**: parser abstraction, Tree-sitter deep parsing for JavaScript/TypeScript/TSX, Structural Graph v3, deterministic cross-language import/symbol/call resolution, symbol-aware impact intelligence, and prioritized test intelligence. Python AST extraction and Project Brain freshness/persistence remain intact; unavailable deep parsers degrade safely to deterministic fallback. The graph guides navigation and blast-radius analysis but never replaces source authority. Codex remains the stable/reference adapter; Claude Code, Gemini CLI, Cursor, and OpenCode share the same vendor-neutral core through their native adapters.'''
          text=replace(text,old_status,new_status,'README status')
          p.write_text(text,encoding='utf-8')

          # CHANGELOG
          p=Path('CHANGELOG.md'); text=p.read_text(encoding='utf-8')
          insert='''## 0.8.0 — Polyglot Intelligence\n\n- Added a first-class **parser abstraction** so repository extraction is selected by deterministic parser capability instead of being embedded in the graph builder.\n- Added optional pinned **Tree-sitter** runtime packages for JavaScript/JSX, TypeScript, and TSX while keeping the core dependency-light and preserving safe regex fallback when deep parsing is unavailable.\n- Added deep JavaScript/TypeScript/TSX extraction for functions, arrow functions, classes/methods, TypeScript interfaces/types/enums, imports/exports, CommonJS bindings, calls, inheritance, and source locations.\n- Upgraded repository intelligence to **Structural Graph v3** with `IMPORTS_SYMBOL`, language metadata, import bindings, cross-language edge markers, and deterministic resolution across repository-owned relative source imports.\n- Added cross-language graph evidence such as JavaScript callers of TypeScript symbols, TSX consumers of TypeScript modules, and test imports across source boundaries.\n- Upgraded Impact Intelligence to map Git diff hunks to changed symbols before reverse traversal, with weighted relation/provenance/distance scoring, confidence, compact evidence, and explicit cross-language dependents.\n- Upgraded Test Intelligence to schema v3 with structural confidence scores, unit/integration/e2e classification, cross-language test mapping, and P0/P1/P2 prioritized test plans.\n- Extended health and doctor diagnostics with Tree-sitter availability, parser/language coverage, cross-language edge counts/relations, and Graph v3 status.\n- Added a dedicated Polyglot integration fixture proving TypeScript, TSX, JavaScript → TypeScript calls, test mapping, and symbol-aware TypeScript impact; CI tests dependency-light fallback first and installed Tree-sitter second.\n- Preserved Project Brain freshness, canonical-root persistence, Codex lifecycle gates, bounded Working Sets, Scope Guard, cache behavior, source authority, and existing host adapters.\n- Added `PRD-v0.8.md` and updated Linux/Windows release validation for v0.8.0.\n\n'''
          anchor='All notable Codemium changes are recorded here.\n\n'
          text=replace(text,anchor,anchor+insert,'CHANGELOG anchor'); p.write_text(text,encoding='utf-8')

          # INSTALL
          p=Path('INSTALL.md'); text=p.read_text(encoding='utf-8')
          old='Codemium v0.7 does **not** require a vector database, embeddings service, graph database, or LLM/API key to build its Structural Intelligence index. Python source receives standard-library AST extraction; other supported languages degrade to deterministic fallback coverage when deeper parsing is not available.'
          new='''Codemium v0.8 does **not** require a vector database, embeddings service, graph database, or LLM/API key to build its Structural Intelligence index. Python source receives standard-library AST extraction and all supported languages retain deterministic fallback coverage.\n\nFor deep **Polyglot Intelligence** on JavaScript/JSX, TypeScript, and TSX, install the optional pinned Tree-sitter runtime:\n\n```sh\npython -m pip install -r requirements-polyglot.txt\n```\n\nWithout those optional packages Codemium still works; JS/TS/TSX degrade to deterministic fallback parsing and health/doctor report the reduced parser capability explicitly.'''
          text=replace(text,old,new,'INSTALL polyglot prerequisites')
          text=text.replace('remains part of v0.7.', 'remains part of v0.8.',1)
          text=text.replace('`health.py` reports graph schema/freshness, parser/capability coverage, relationship provenance, unresolved relationships, and Project Brain freshness.','`health.py` reports Graph v3 schema/freshness, Tree-sitter runtime availability, parser/language/capability coverage, cross-language relationships, provenance, unresolved relationships, and Project Brain freshness.',1)
          text=text.replace('Structural blast-radius signals can escalate depth', 'Symbol-aware and cross-language blast-radius signals can escalate depth',1)
          p.write_text(text,encoding='utf-8')

          # Canonical PRD index
          p=Path('PRD.md'); text=p.read_text(encoding='utf-8')
          text=replace(text,'The normative v0.7 extension is [`PRD-v0.7.md`](PRD-v0.7.md).','The normative v0.8 extension is [`PRD-v0.8.md`](PRD-v0.8.md). The v0.7 Structural Intelligence & Evidence Bridge definition remains preserved in [`PRD-v0.7.md`](PRD-v0.7.md) as release history and compatibility context.','PRD extension')
          text=text.replace('**Structural Intelligence** describes what the repository currently contains: files, modules, symbols, calls, imports, references, inheritance, dependencies, and test relationships where deterministic parser capability permits.','**Structural / Polyglot Intelligence** describes what the repository currently contains: files, modules, symbols, calls, imports, imported-symbol bindings, references, inheritance, dependencies, cross-language relationships, and test relationships where deterministic parser capability permits. v0.8 adds Tree-sitter JavaScript/TypeScript/TSX extraction and Graph v3 while preserving safe fallback parsing.',1)
          bridge='The repository remains the source of implementation truth. Tests/runtime evidence remain the source of behavioral proof. The graph guides navigation and impact; Project Brain carries freshness-qualified durable knowledge.\n'
          addition=bridge+'''\n### v0.8 Polyglot Intelligence extension\n\nThe current release architecture is defined normatively in `PRD-v0.8.md`: parser abstraction, optional Tree-sitter deep parsing for JavaScript/TypeScript/TSX, cross-language Graph v3 relationships, symbol-aware impact traversal, and confidence-ranked test intelligence. Deep parser availability never authorizes stronger claims than the observed provenance, and unavailable optional parsers must degrade safely.\n'''
          text=replace(text,bridge,addition,'PRD polyglot extension'); p.write_text(text,encoding='utf-8')

          Path('.github/workflows/v08-docs-publish.yml').unlink(missing_ok=True)
          PY
      - name: Commit migrated docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md INSTALL.md PRD.md .github/workflows/v08-docs-publish.yml
          git commit -m 'docs: publish v0.8 Polyglot Intelligence release docs [v08-docs]'
          git push origin HEAD:release/v0.8.0-polyglot-intelligence
