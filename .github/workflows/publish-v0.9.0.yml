name: Publish v0.9.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.9.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.0 >/dev/null 2>&1; then
            echo 'Release v0.9.0 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.9.0 \
            --target 764f038501ab29726c36802a1bd7a79c3db2498b \
            --title 'Codemium v0.9.0 — Anti-Slop Intelligence' \
            --notes-file RELEASE_NOTES-v0.9.0.md \
            --latest
