name: Codemium Codex Plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  codex-plugin:
    name: Codex lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Codex plugin lifecycle
        run: python scripts/verify_codex_plugin.py
